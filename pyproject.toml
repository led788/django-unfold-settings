[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-unfold-settings"
dynamic = ["version"]
description = "A Django package for managing typed settings via Unfold admin with strict validation and cached JSON API output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Denis Zaikin", email = "led7889@gmail.com" }
]
urls = { Repository = "https://github.com/led788/django-unfold-settings" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=4.2",
    "django-unfold>=0.20.0",
]

[tool.hatch.version]
path = "src/unfold_settings/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unfold_settings"]
